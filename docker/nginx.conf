server {
    listen 80;
    server_name _;

    # Static assets (Next.js)
    location /_next/static {
        alias /var/www/html/frontend/.next/static;
        expires 365d;
        access_log off;
    }

    # API Proxy
    location ~ ^/(api|sanctum) {
        root /var/www/html/backend/public;
        try_files $uri $uri/ @backend;
    }

    location @backend {
        root /var/www/html/backend/public;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        
        # AI generation can take a long time
        fastcgi_read_timeout 600;
        proxy_read_timeout 600;
    }

    # Frontend Proxy (Next.js Standalone)
    location / {
        # Try to serve static files from public folder first
        root /var/www/html/frontend/public;
        try_files $uri @next_app;
    }

    location @next_app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Next.js Server Side Events / Streaming
        proxy_read_timeout 600;
    }
}
