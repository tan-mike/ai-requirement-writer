version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-requirement-writer-app
    ports:
      - "8088:80"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: mysql:8.1
    environment:
      MYSQL_USER: writer
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: req_writer
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    ports:
      - "3310:3306"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "900", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
